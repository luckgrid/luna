[package]
name = "cli"
version = "0.1.0"
description = "Rust `luna` CLI: a Moon/Proto-backed orchestrator for the Luna monorepo."
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "luna"
path = "src/main.rs"

[dependencies]
async-trait = "0.1"
clap = { version = "4.5", features = ["derive", "wrap_help", "env"] }
home = "0.5"
miette = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
starbase = { version = "0.11.1", features = ["tracing"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
tracing = "0.1"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
