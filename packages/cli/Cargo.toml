[package]
name = "cli"
version = "0.1.0"
description = "Rust `luna` CLI: a Moon/Proto-backed orchestrator for the Luna monorepo."
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "luna"
path = "src/main.rs"

[dependencies]
async-trait = "0.1"
clap = { version = "4.5", features = ["derive", "wrap_help", "env"] }
home = "0.5"
iocraft = "0.8"
miette = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
starbase = { version = "0.11.1", features = ["tracing"] }
starbase_console = { version = "0.6.27", features = ["ui"] }
starbase_styles = "0.6.7"
time = { version = "0.3", features = ["parsing"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
toml = "0.8"
toml_edit = "0.22"
clap_complete = "4.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
ureq = { version = "2", default-features = false, features = ["tls"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
