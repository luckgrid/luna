# Enable Rust (version from `.prototools` via versionFromPrototools).
# syncToolchainConfig writes `rust-toolchain.toml` `channel` from that pin;
# components are installed by moon (not written to the file).
rust:
  syncToolchainConfig: true
  components:
    - clippy
    - rustfmt

# Enable JavaScript (shared settings for bun/node/deno toolchains).
# In moon v2, package manager and JS-wide settings live under `javascript:`.
javascript:
  packageManager: bun
  # Moon’s InstallDependencies runs before tasks; redundant after `bun install` in `luna install`,
  # and it slows persistent targets (`dev`). Safe now that the root lifecycle is `luna install`.
  installDependencies: false

# Enable Bun (proto-pinned via `.prototools`).
bun:
  # Belt-and-suspenders if InstallDependencies is ever re-enabled.
  installArgs:
    - "--ignore-scripts"

# Python is still unstable in moon v2 and is intentionally NOT enabled here.
# Python projects declare `language: python` and use explicit `uv sync` / `uv run`
# tasks (see `.moon/tasks/py-api.yml`, `.moon/tasks/py-lib.yml`); toolchain
# auto-management would clash with the existing `.venv` and `pyproject.toml` layout.

# Enable TypeScript. Project-reference auto-sync is OFF because `@luna/ds` and
# `@luna/ui` are source-first packages (consumed via Bun workspace resolution +
# `moduleResolution: bundler`) with `noEmit: true`. TS v6 forbids referencing
# non-emitting projects, so we let the root `tsconfig.json` own references.
typescript:
  syncProjectReferences: false
