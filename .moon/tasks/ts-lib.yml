inheritedBy:
  language: typescript
  tags:
    - bun-ts-lib

fileGroups:
  configs:
    - "*.config.ts"
    - "*.json"
  sources:
    - "src/**/*"

tasks:
  build:
    command: "bun run build"
    inputs:
      - "@group(configs)"
      - "@group(sources)"
    outputs:
      - "dist"

  dev:
    command: "bun run dev"
    preset: "server"
    inputs:
      - "@group(configs)"
      - "@group(sources)"

  typecheck:
    command: "tsc"
    args:
      - "--noEmit"
    inputs:
      - "@group(configs)"
      - "@group(sources)"

  clean:
    command: git
    args:
      - clean
      - -fdx
      - --
      - dist
      - node_modules
    options:
      cache: false
