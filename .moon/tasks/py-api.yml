inheritedBy:
  language: python
  layer: application
  stack: backend
  tags:
    - fast-api

fileGroups:
  configs:
    - "*.toml"
    - ".env*"
  sources:
    - "src/**/*.py"
  tests:
    - "tests/**/*"

tasks:
  build:
    command: "uv"
    args: ["sync"]
    inputs:
      - "@group(configs)"
      - "/pyproject.toml"
    outputs:
      - "/uv.lock"

  dev:
    command: "uv"
    args:
      - "run"
      - "uvicorn"
      - "main:app"
      - "--reload"
      - "--host"
      - "${API_HOST:-localhost}"
      - "--port"
      - "${API_PORT:-8000}"
    deps:
      - "build"
    env:
      API_DEBUG: "true"
      PYTHONPATH: "src"
    options:
      envFile: "/.env.local"
      persistent: true
      runInCI: false

  start:
    command: "uv"
    args:
      - "run"
      - "uvicorn"
      - "main:app"
      - "--host"
      - "${API_HOST:-localhost}"
      - "--port"
      - "${API_PORT:-8000}"
    deps:
      - "build"
    env:
      PYTHONPATH: "src"
    options:
      envFile: "/.env.local"
      persistent: true

  lint:
    command: "uv"
    args: ["run", "ruff", "check", "."]
    deps:
      - "build"
    inputs:
      - "@group(sources)"
      - "@group(tests)"

  lint-fix:
    command: "uv"
    args: ["run", "ruff", "check", "--fix", "src"]
    deps:
      - "build"
    inputs:
      - "src/**/*.py"
    options:
      runInCI: false

  format:
    command: "uv"
    args: ["run", "ruff", "format", "src"]
    deps:
      - "build"
    inputs:
      - "src/**/*.py"
    options:
      runInCI: false

  format-check:
    command: "uv"
    args: ["run", "ruff", "format", "--check", "."]
    deps:
      - "build"
    inputs:
      - "@group(sources)"
      - "@group(tests)"

  test:
    command: "uv"
    args: ["run", "pytest", "tests/"]
    deps:
      - "build"
    env:
      API_DEBUG: "true"
    inputs:
      - "@group(sources)"
      - "@group(tests)"
    options:
      envFile: "/.env.local"

  clean:
    script: >-
      git clean -fdx -- .pytest_cache .ruff_cache .eggs .venv &&
      find . -type d -name __pycache__ -prune -exec rm -rf {} + 2>/dev/null || true
    options:
      cache: false
      runInCI: false
