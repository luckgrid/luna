inheritedBy:
  language: rust
  tags:
    - cargo

fileGroups:
  configs:
    - "Cargo.toml"
  sources:
    - "src/**/*"

tasks:
  build:
    command: cargo
    args: ["build"]
    inputs:
      - "@group(configs)"
      - "@group(sources)"
      - "/Cargo.lock"
    outputs:
      - "/target/debug/luna"

  install:
    command: cargo
    args: ["install", "--path", ".", "--locked", "--force"]
    deps:
      - "~:build"
    inputs:
      - "@group(configs)"
      - "@group(sources)"
      - "/Cargo.lock"
    options:
      cache: false
      runInCI: false

  test:
    command: cargo
    args: ["test"]
    deps:
      - "~:build"
    inputs:
      - "@group(configs)"
      - "@group(sources)"

  lint:
    command: cargo
    args: ["clippy", "--", "-D", "warnings"]
    deps:
      - "~:build"
    inputs:
      - "@group(configs)"
      - "@group(sources)"

  format-check:
    command: cargo
    args: ["fmt", "--check"]
    inputs:
      - "@group(configs)"
      - "@group(sources)"

  clean:
    command: cargo
    args: ["clean"]
    options:
      cache: false
      runInCI: false
