name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      UV_PYTHON_PREFERENCE: system
      DATABASE_URL: sqlite+aiosqlite:///./data.db
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: "true"

      - uses: socketdev/action@v1
        with:
          mode: firewall

      - run: moon run cli:build
      - run: ./target/debug/luna install --workspace

  windows-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: "true"
      - run: moon run cli:build
      - run: ./target/debug/luna.exe doctor
      - run: ./target/debug/luna.exe sync --workspace --locked
      - run: ./target/debug/luna.exe ci --json
