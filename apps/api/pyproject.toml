[project]
name = "api"
version = "0.1.0"
description = "FastAPI + Pydantic AI backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "pydantic-ai",
  "pydantic",
  "pydantic-settings",
  "sqlalchemy[asyncio]",
  "aiosqlite",
  "py-demo",
]

[tool.uv]
package = false

[tool.uv.sources]
py-demo = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]
