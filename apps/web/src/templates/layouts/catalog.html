<main>
	<header>
		<hgroup>
			{{#if category}}<small>{{category}}</small>{{/if}}
			<h1>{{title}}</h1>
			{{#if description}}<p>{{description}}</p>{{/if}}
			{{#if (or meta.hasDate meta.hasTags)}}
			<div data-article-meta>{{> article-meta meta}}</div>
			{{/if}}
		</hgroup>
		<form role="search" method="get" action="#" aria-label="Search posts">
			<input type="search" name="q" placeholder="Search…" autocomplete="off" aria-label="Search query"/>
			<button type="submit">Search</button>
		</form>
	</header>
	<article>
		{{{body}}}
	</article>
	{{#each catalogSections}}
		{{> posts-catalog title=title description=description items=items}}
	{{/each}}
</main>
