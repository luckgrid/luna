<script>
  (function () {
    var form = document.querySelector('form[role="search"]');
    var input = document.getElementById("catalog-search");
    var list = document.getElementById("catalog-list");
    var status = document.getElementById("catalog-search-status");
    var pager = document.getElementById("catalog-pagination");
    var data = document.getElementById("catalog-entries");
    if (!input || !list || !data) return;

    var entries = JSON.parse(data.textContent || "[]");
    var initial = list.innerHTML;

    function escapeHTML(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function renderEntry(entry) {
      var parts = [
        '<li data-search="' + escapeHTML(entry.search) + '">',
        '<a href="' + escapeHTML(entry.url) + '" data-card>',
        "<hgroup>",
        "<h3>" + escapeHTML(entry.title) + "</h3>"
      ];

      if (entry.metaLabel) {
        parts.push("<p>" + escapeHTML(entry.metaLabel) + "</p>");
      } else if (entry.dateISO && entry.dateLabel) {
        parts.push(
          '<p><time datetime="' +
            escapeHTML(entry.dateISO) +
            '">' +
            escapeHTML(entry.dateLabel) +
            "</time></p>"
        );
      }

      if (entry.description) {
        parts.push("<p>" + escapeHTML(entry.description) + "</p>");
      }

      parts.push("</hgroup>", "</a>", "</li>");
      return parts.join("");
    }

    function filter() {
      var q = (input.value || "").toLowerCase().trim();
      if (!q) {
        list.innerHTML = initial;
        if (pager) pager.hidden = false;
        if (status) status.hidden = true;
        return;
      }

      var matches = entries.filter(function (entry) {
        return entry.search.indexOf(q) !== -1;
      });

      list.innerHTML = matches.map(renderEntry).join("");

      if (pager) pager.hidden = true;
      if (status) status.hidden = matches.length !== 0;
    }

    if (form) {
      form.addEventListener("submit", function (event) {
        event.preventDefault();
        filter();
      });
    }

    input.addEventListener("input", filter);
    input.addEventListener("search", filter);
  })();
</script>
