{{- $parent := .CurrentSection -}}
{{- $showName := true -}}
{{- with $parent }}{{- $showName = false -}}{{- end -}}
<ol data-breadcrumbs>
  <li>
    {{- partial "brand.html" (dict "page" . "showName" $showName) -}}
  </li>
  {{- with $parent }}
  <li><a href="{{ .RelPermalink }}">{{ .Title }}</a></li>
  {{- end }}
  <li aria-current="page">{{ .Title }}</li>
</ol>
