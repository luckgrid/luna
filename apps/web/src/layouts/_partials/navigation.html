{{- $page := .page | default . -}}
<ul>
  <li>
    <a
      href='{{ "posts/" | relURL }}'
      {{- if or (eq $page.RelPermalink "/posts/") (eq $page.Section "posts") }}
      aria-current="page"
      data-active
      {{- end }}
      >Posts</a
    >
  </li>
  <li>
    <a
      href='{{ "legal/" | relURL }}'
      {{- if eq $page.Section "legal" }}
      aria-current="page"
      data-active
      {{- end }}
      >Legal</a
    >
  </li>
</ul>
