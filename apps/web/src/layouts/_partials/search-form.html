{{- /*
  Params (dict):
    id, label, placeholder?, name?, submit?
*/ -}}
{{- $id := .id | default "search" -}}
{{- $label := .label | default "Search" -}}
{{- $placeholder := .placeholder | default $label -}}
{{- $name := .name | default "q" -}}
{{- $submit := .submit | default "Search" -}}
<form role="search" aria-label="{{ $label }}">
  <input
    type="search"
    id="{{ $id }}"
    name="{{ $name }}"
    placeholder="{{ $placeholder }}"
    autocomplete="off"
    aria-label="{{ $label }}"
  />
  <button type="submit">{{ $submit }}</button>
</form>
