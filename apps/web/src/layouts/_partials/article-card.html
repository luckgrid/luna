{{- $isCollection := eq .Kind "section" -}}
<a href="{{ .RelPermalink }}" data-card>
  <hgroup>
    <h3>{{ .Title }}</h3>
    {{- if $isCollection -}}
    <p>Collection</p>
    {{- else if .Date -}}
    <p><time datetime='{{ .Date.Format "2006-01-02" }}'>{{ .Date.Format "Jan 2, 2006" }}</time></p>
    {{- end -}}
    {{- with .Description -}}
    <p>{{ . }}</p>
    {{- end -}}
  </hgroup>
</a>
