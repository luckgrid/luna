{{- with resources.Get "css/bundle.css" -}} {{- if hugo.IsDevelopment -}}
<link rel="stylesheet" href="{{ .RelPermalink }}" />
{{- else -}} {{- with . | fingerprint -}}
<link
  rel="stylesheet"
  href="{{ .RelPermalink }}"
  integrity="{{ .Data.Integrity }}"
  crossorigin="anonymous"
/>
{{- end -}} {{- end -}} {{- else -}} {{- warnf "css/bundle.css missing — run Tailwind before hugo (moon run web:build)" -}} {{- end -}}
