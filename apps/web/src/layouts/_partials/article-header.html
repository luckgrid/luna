<header>
  <hgroup>
    {{- with .Params.category }}<small>{{ . }}</small>{{ end -}}
    <h1>{{ .Title }}</h1>
    {{- with .Description -}}
    <p>{{ . }}</p>
    {{- end -}} {{- $show := and (eq .Kind "page") (or .Date (not (eq (len .Params.tags) 0))) -}} {{- if $show -}}
    {{- partial "article-meta.html" . -}}
    {{- end -}}
  </hgroup>
</header>
