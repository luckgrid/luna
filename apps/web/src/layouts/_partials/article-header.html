<header>
  <hgroup>
    {{- partial "article-meta.html" . -}}
    <h1>{{ .Title }}</h1>
    {{- with .Description -}}
    <p>{{ . }}</p>
    {{- end -}}
  </hgroup>
  {{- with .Params.tags -}}
  <ul aria-label="Tags" data-group>{{- range . -}}<li data-tag>#{{ replaceRE "[-/_]" " " . | replaceRE "\\s+" " " | strings.TrimSpace | title }}</li> {{ end -}}</ul>
  {{- end -}}
</header>
