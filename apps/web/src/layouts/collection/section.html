{{ define "main" }}
{{- partial "header.html" . -}}
<aside aria-label="In this collection">{{ partial "article/collection.html" . }}</aside>
<main>
  {{- partial "page-header.html" . -}}
  <article>
    {{ .Content }}
  </article>
  {{- if .Params.toc }}
  <aside aria-label="In this article">
    {{- partial "toc.html" . -}}
  </aside>
  {{- end }}
</main>
{{ end }}
