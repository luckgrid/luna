baseURL = "https://example.org/"
locale = "en"
title = "Luna"

enableRobotsTXT = false
enableEmoji = true

publishDir = "dist"
staticDir = "public"

disableKinds = []

[build]
[build.buildStats]
enable = true
[[build.cachebusters]]
source = "assets/ds/.*\\.css"
target = "css"
[[build.cachebusters]]
source = "(postcss|tailwind)\\.config\\.js"
target = "css"

[pagination]
pagerSize = 10

[module]
[[module.mounts]]
source = "src/archetypes"
target = "archetypes"
[[module.mounts]]
source = "src/assets"
target = "assets"
[[module.mounts]]
source = "src/content"
target = "content"
[[module.mounts]]
source = "src/data"
target = "data"
[[module.mounts]]
source = "src/i18n"
target = "i18n"
[[module.mounts]]
source = "src/layouts"
target = "layouts"
[[module.mounts]]
source = "../../packages/ds"
target = "assets/ds"

[params]
description = "Luna template static site."
author = "Luna"
og_image = "/favicon.svg"

[sitemap]
changefreq = "weekly"
priority = 0.5
filename = "sitemap.xml"

[outputs]
home = ["HTML", "RSS"]
section = ["HTML", "RSS"]

[permalinks]
posts = "/posts/:slug/"

[markup]
[markup.goldmark]
[markup.goldmark.parser]
# Render hooks under layouts/_markup/ (links, images, headings, blockquotes, code blocks).
# wrapStandAloneImageWithinParagraph = false lets render-image.html emit <figure> for standalone images.
wrapStandAloneImageWithinParagraph = false
[markup.goldmark.parser.attribute]
# Enable Markdown attributes on block-level elements so code fences can carry {filename="..."} etc.
# Consumed by layouts/_markup/render-codeblock.html.
block = true
[markup.goldmark.renderer]
unsafe = false

[markup.highlight]
anchorLineNos = false
codeFences = true
guessSyntax = false
lineNos = false
noClasses = false
style = "monokai"
tabWidth = 2

[markup.tableOfContents]
startLevel = 2
endLevel = 4
ordered = false

[services]
[services.rss]
limit = 20
